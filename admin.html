
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tippskings – Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#10151e;--panel:#1a2330;--line:#303c4c;--green:#21d49a;--text:#f4f7fb;--muted:#aab5c5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
header{padding:20px;background:#151d28;border-bottom:1px solid var(--line)}
header h1{margin:0;color:var(--green);font-size:24px}
header p{color:var(--muted);margin:7px 0 0}
main{max-width:1000px;margin:auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
h2{margin-top:0;font-size:19px}
label{display:block;margin:12px 0 6px;color:#dce5f0}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:#101722;color:white;font-size:16px}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
button{border:0;border-radius:8px;padding:12px 15px;font-size:15px;font-weight:bold;cursor:pointer;margin:10px 5px 0 0}
.primary{background:var(--green);color:#082218}
.secondary{background:#354357;color:white}
.danger{background:#8d3038;color:white}
.hidden{display:none!important}
#message{white-space:pre-wrap;margin:12px 0;color:var(--green)}
.tip{padding:14px 0;border-bottom:1px solid var(--line)}
.tip h3{margin:0 0 8px}
.meta{color:var(--muted);font-size:13px;line-height:1.7}
.tag{display:inline-block;padding:4px 8px;background:#26384a;border-radius:6px;margin:3px 4px 3px 0}
.vip{background:#5b4520;color:#ffe29b}
@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:12px}.panel{padding:14px}}
</style>
</head>
<body>
<header>
<h1>tippskings</h1>
<p>Adminisztrációs felület · Sportfogadási tippek</p>
</header>

<main>
<section id="login" class="panel">
<h2>Admin bejelentkezés</h2>
<p class="meta">Jelentkezz be a Supabase-fiókod e-mail-címével és jelszavával.</p>
<form id="loginForm">
<label for="email">E-mail-cím</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Jelszó</label>
<input id="password" type="password" autocomplete="current-password" required>
<button class="primary" type="submit">Bejelentkezés</button>
</form>
</section>

<section id="dashboard" class="hidden">
<div class="panel">
<h2>Adminisztráció</h2>
<p class="meta">Bejelentkezve: <span id="userEmail"></span></p>
<button id="logout" class="secondary">Kijelentkezés</button>
<div id="message" role="status"></div>
</div>

<div class="panel">
<h2 id="formTitle">Új tipp hozzáadása</h2>
<form id="tipForm">
<input id="tipId" type="hidden">
<div class="grid">
<div><label for="league">Bajnokság</label><input id="league" required placeholder="Pl. Premier League"></div>
<div><label for="category">Kategória</label>
<select id="category">
<option value="gol">Gólok</option>
<option value="1x2">1X2</option>
<option value="mindketto">Mindkét csapat gólt szerez</option>
<option value="hendikep">Hendikep</option>
<option value="egyeb">Egyéb</option>
</select></div>
<div><label for="home">Hazai csapat</label><input id="home" required></div>
<div><label for="away">Vendégcsapat</label><input id="away" required></div>
<div><label for="matchTime">Mérkőzés időpontja</label><input id="matchTime" type="datetime-local"></div>
<div><label for="market">Fogadási tipp</label><input id="market" required placeholder="Pl. Több mint 2,5 gól"></div>
<div><label for="odds">Odds</label><input id="odds" type="number" min="1.01" step="0.01" required placeholder="1.85"></div>
<div><label for="status">Állapot</label>
<select id="status">
<option value="draft">Piszkozat</option>
<option value="published">Közzétéve</option>
<option value="won">Nyertes</option>
<option value="lost">Vesztes</option>
<option value="void">Érvénytelen</option>
</select></div>
</div>
<label for="vip">Tipp típusa</label>
<select id="vip">
<option value="false">Ingyenes</option>
<option value="true">VIP</option>
</select>
<label for="analysis">Elemzés / megjegyzés</label>
<textarea id="analysis" placeholder="A tipp rövid indoklása..."></textarea>
<button class="primary" id="saveBtn" type="submit">Tipp mentése</button>
<button class="secondary" id="cancelEdit" type="button" hidden>Mégse</button>
</form>
</div>

<div class="panel">
<h2>Rögzített tippek</h2>
<button id="refresh" class="secondary">Lista frissítése</button>
<div id="tipsList">A tippek betöltése...</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://wtioblmrnpdceqvqxtbj.supabase.co";

/* A projektedhez korábban megadott publikus anon kulcs */
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0aW9ibG1ybnBkY2VxdnF4dGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjY5NTksImV4cCI6MjEwNzY0Mjk1OX0.vO9xhwrmD5AhKtgj-9hY0kG8jUcqPSZemjGmeHRq53E";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let currentUser = null;

function message(text, error = false) {
  $("message").textContent = text;
  $("message").style.color = error ? "#ff8c91" : "#21d49a";
}

function showLogin() {
  currentUser = null;
  $("login").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
}

function showDashboard(user) {
  currentUser = user;
  $("login").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("userEmail").textContent = user.email || "";
  loadTips();
}

async function checkSession() {
  const {data, error} = await db.auth.getSession();
  if (error) {
    alert("Supabase-hiba: " + error.message);
    return;
  }
  if (data.session) showDashboard(data.session.user);
  else showLogin();
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const {data, error} = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });
  if (error) {
    alert("Bejelentkezési hiba: " + error.message);
    return;
  }
  showDashboard(data.user);
});

$("logout").addEventListener("click", async () => {
  const {error} = await db.auth.signOut();
  if (error) alert(error.message);
  else showLogin();
});

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") showLogin();
});

function resetForm() {
  $("tipForm").reset();
  $("tipId").value = "";
  $("formTitle").textContent = "Új tipp hozzáadása";
  $("saveBtn").textContent = "Tipp mentése";
  $("cancelEdit").hidden = true;
}
$("cancelEdit").addEventListener("click", resetForm);

$("tipForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!currentUser) return alert("Előbb jelentkezz be.");

  const rawTime = $("matchTime").value;
  const tip = {
    league: $("league").value.trim(),
    home_team: $("home").value.trim(),
    away_team: $("away").value.trim(),
    match_time: rawTime ? new Date(rawTime).toISOString() : null,
    category: $("category").value,
    market: $("market").value.trim(),
    odds: Number($("odds").value),
    status: $("status").value,
    is_vip: $("vip").value === "true",
    analysis: $("analysis").value.trim() || null
  };

  if (!Number.isFinite(tip.odds) || tip.odds <= 1) {
    alert("Az odds legyen 1-nél nagyobb szám.");
    return;
  }

  const id = $("tipId").value;
  const result = id
    ? await db.from("tips").update(tip).eq("id", Number(id))
    : await db.from("tips").insert(tip);

  if (result.error) {
    message("Mentési hiba: " + result.error.message, true);
    return;
  }
  message(id ? "Tipp módosítva." : "Tipp hozzáadva.");
  resetForm();
  await loadTips();
});

async function loadTips() {
  if (!currentUser) return;
  $("tipsList").textContent = "Betöltés...";

  const {data, error} = await db.from("tips")
    .select("*").order("created_at", {ascending: false});

  if (error) {
    $("tipsList").textContent = "Betöltési hiba: " + error.message;
    return;
  }
  if (!data.length) {
    $("tipsList").textContent = "Még nincs rögzített tipp.";
    return;
  }

  $("tipsList").replaceChildren();
  for (const tip of data) {
    const article = document.createElement("article");
    article.className = "tip";
    const title = document.createElement("h3");
    title.textContent = tip.home_team + " – " + tip.away_team;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${tip.league} · ${tip.market} · Odds: ${tip.odds} · Állapot: ${tip.status}`;
    const tag = document.createElement("span");
    tag.className = "tag" + (tip.is_vip ? " vip" : "");
    tag.textContent = tip.is_vip ? "VIP" : "Ingyenes";

    const edit = document.createElement("button");
    edit.className = "secondary";
    edit.textContent = "Szerkesztés";
    edit.addEventListener("click", () => editTip(tip));

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "Törlés";
    del.addEventListener("click", () => deleteTip(tip.id));

    article.append(title, meta, tag, document.createElement("br"), edit, del);
    $("tipsList").appendChild(article);
  }
}

function editTip(tip) {
  $("tipId").value = tip.id;
  $("league").value = tip.league;
  $("home").value = tip.home_team;
  $("away").value = tip.away_team;
  $("category").value = tip.category;
  $("market").value = tip.market;
  $("odds").value = tip.odds;
  $("status").value = tip.status;
  $("vip").value = String(tip.is_vip);
  $("analysis").value = tip.analysis || "";

  if (tip.match_time) {
    const d = new Date(tip.match_time);
    const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    $("matchTime").value = local.toISOString().slice(0, 16);
  } else $("matchTime").value = "";

  $("formTitle").textContent = "Tipp szerkesztése";
  $("saveBtn").textContent = "Módosítás mentése";
  $("cancelEdit").hidden = false;
  window.scrollTo({top: 0, behavior: "smooth"});
}

async function deleteTip(id) {
  if (!confirm("Biztosan törlöd ezt a tippet?")) return;
  const {error} = await db.from("tips").delete().eq("id", id);
  if (error) {
    message("Törlési hiba: " + error.message, true);
    return;
  }
  message("Tipp törölve.");
  await loadTips();
}

$("refresh").addEventListener("click", loadTips);
checkSession();
</script>
</body>
</html>
